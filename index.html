<!DOCTYPE html>
<html>
<head>
  <title>Project Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; background: #f9fafb; color: #111827; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .branch-link { display: block; padding: 12px; margin: 8px 0; background: #f3f4f6; color: #2563eb; text-decoration: none; border-radius: 6px; }
    .branch-link:hover { background: #e5e7eb; }
    .tag { font-size: 0.8rem; background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deployments</h1>
    <div id="list">Loading branches...</div>
  </div>
  <script>
    fetch('./branches.json')
      .then(r => r.json())
      .then(branches => {
        const list = document.getElementById('list');
        list.innerHTML = branches.map(b => 
          `<a class="branch-link" href="./${b}/">📂 ${b} ${b === '2026_05_14_claude' ? '<span class="tag">Just Updated</span>' : ''}</a>`
        ).join('');
      });
  </script>
</body>
</html>
