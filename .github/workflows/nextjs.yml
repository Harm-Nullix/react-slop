name: Deploy Branch to Subfolder

on:
  push:
    branches:
      - '**' # Matches every branch including feature/branch-name

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        # Extract branch name and use it as the base path for Vite/React
        # We replace slashes with underscores to avoid folder nesting issues
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//_/g')
          pnpm run build -- --base=/${{ github.event.repository.name }}/$BRANCH_NAME/

      - name: Organize into subfolder
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//_/g')
          mkdir -p temp_out/$BRANCH_NAME
          cp -r dist/* temp_out/$BRANCH_NAME/
          # Optional: add an index.html in the root of temp_out to link to all branches

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./temp_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
