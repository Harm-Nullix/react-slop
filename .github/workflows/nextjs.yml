name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch

# Zorgt ervoor dat slechts één build tegelijk naar gh-pages kan schrijven.
concurrency:
  group: deploy-to-gh-pages  # Vaste string voor de hele repo
  cancel-in-progress: false   # Belangrijk: zet ze in de wachtrij, niet annuleren!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # --- AUTO-INSTALLER ---
      - name: Auto-sync missing dependencies
        id: sync
        run: |
          npx depcheck --json > depcheck-report.json || true
          
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          try {
            const report = JSON.parse(fs.readFileSync('./depcheck-report.json', 'utf8'));
            const pkgJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const missing = Object.keys(report.missing || {});
            
            if (missing.length > 0) {
              if (!pkgJson.dependencies) pkgJson.dependencies = {};
              missing.forEach(pkg => {
                try {
                  const version = execSync('pnpm info ' + pkg + ' version').toString().trim();
                  pkgJson.dependencies[pkg] = '^' + version;
                  console.log('Toegevoegd: ' + pkg + '@^' + version);
                } catch (e) {
                  pkgJson.dependencies[pkg] = 'latest';
                }
              });
              fs.writeFileSync('./package.json', JSON.stringify(pkgJson, null, 2));
              console.log('SYNC_COMPLETE=true');
            }
          } catch (err) {
            console.error('Fout tijdens sync:', err);
          }
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # STAP 1: Genereer de slug in een eigen schone omgeving
      - name: Generate Project Slug
        id: slug_generator
        run: |
          node << 'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const title = pkg.title || pkg.name || 'untitled';
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
          
          // Sla de slug veilig op in de GitHub omgeving
          fs.appendFileSync(process.env.GITHUB_ENV, `PROJECT_SLUG=${slug}\n`);
          EOF

      # STAP 2: Bouw de applicatie en update de registry
      - name: Build and Update Branch Registry
        run: |
          # Gebruik de SLUG voor het Vite pad
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$PROJECT_SLUG/
          pnpm run build --base=$VITE_BASE_PATH
          
          # Bereid de mappen voor
          mkdir -p root_deploy/$PROJECT_SLUG
          cp -r dist/* root_deploy/$PROJECT_SLUG/
          
          # Registry updaten (met cache buster)
          curl -fsSL "https://harm-nullix.github.io/react-slop/branches.json?$(date +%s)" > branches.json || echo "[]" > branches.json
          
          # Update branches.json via Node
          node << 'EOF'
          const fs = require('fs');
          
          let registry;
          try {
              const content = fs.readFileSync('branches.json', 'utf8').trim();
              registry = content.startsWith('<') ? [] : JSON.parse(content);
          } catch (e) { 
              registry = []; 
          }
          
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const slug = process.env.PROJECT_SLUG;
          const branchName = process.env.GITHUB_REF_NAME;
          
          registry = registry.map(item => {
              return {
                  name: item.name,
                  slug: item.slug || item.name,
                  title: item.title || item.name,
                  description: item.description || '',
                  tags: item.tags || [],
                  updatedAt: item.updatedAt
              };
          });
          
          registry = registry.filter(item => item.slug !== slug);
          
          registry.push({
              name: branchName,
              slug: slug,
              title: pkg.title || pkg.name || slug,
              description: pkg.description || '',
              tags: pkg.tags || [],
              updatedAt: new Date().toISOString()
          });
          
          fs.writeFileSync('root_deploy/branches.json', JSON.stringify(registry, null, 2));
          EOF
          
          # Genereer Portal HTML (Let op de 'EOF' aan het begin en het einde!)
          cat << 'EOF' > root_deploy/index.html
          <!DOCTYPE html>
            <html lang="nl">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>APP HUB</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
            <style>
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            
            :root {
          --bg:        #07090f;
          --s1:        #0c1018;
          --s2:        #131924;
          --s3:        #1a2233;
          --border:    rgba(255,255,255,0.06);
          --border-hi: rgba(56, 217, 255, 0.3);
          --text:      #dde8f2;
          --muted:     #4a5a75;
          --accent:    #38d9ff;
            --accent-dim:rgba(56, 217, 255, 0.10);
          --pin:       #ffb347;
          --pin-dim:   rgba(255, 179, 71, 0.10);
          --r:         10px;
          }
          
          html { scroll-behavior: smooth; }
            
            body {
          font-family: 'Outfit', sans-serif;
          background-color: var(--bg);
          color: var(--text);
          min-height: 100vh;
          background-image:
            radial-gradient(circle at 15% 20%, rgba(56,217,255,0.03) 0%, transparent 50%),
            radial-gradient(circle at 85% 80%, rgba(255,179,71,0.02) 0%, transparent 50%),
            radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
          background-size: 100% 100%, 100% 100%, 26px 26px;
          }
            
            /* ── HEADER ────────────────────────────── */
            .header {
          max-width: 1320px;
          margin: 0 auto;
          padding: 36px 28px 24px;
          display: flex;
          align-items: baseline;
          gap: 16px;
          }
            .logo {
          font-family: 'Syne', sans-serif;
          font-weight: 800;
          font-size: clamp(2rem, 5vw, 3.2rem);
          letter-spacing: -0.04em;
          line-height: 1;
          background: linear-gradient(120deg, #ffffff 0%, var(--accent) 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          }
            .logo-dot {
          -webkit-text-fill-color: var(--accent);
          background: none;
          -webkit-background-clip: unset;
          background-clip: unset;
          }
            .app-count-badge {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.7rem;
          font-weight: 500;
          color: var(--muted);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 3px 10px;
          letter-spacing: 0.04em;
          transition: color 0.3s;
          }
            
            /* ── STICKY CONTROLS ───────────────────── */
            .controls {
          position: sticky;
          top: 0;
          z-index: 200;
          background: rgba(7, 9, 15, 0.82);
          backdrop-filter: blur(24px) saturate(1.4);
          -webkit-backdrop-filter: blur(24px) saturate(1.4);
          border-bottom: 1px solid var(--border);
          }
            .controls-inner {
          max-width: 1320px;
          margin: 0 auto;
          padding: 14px 28px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          }
            .search-row {
          display: flex;
          gap: 8px;
          align-items: center;
          }
            .search-wrap {
          position: relative;
          flex: 1;
          }
            .search-wrap svg {
          position: absolute;
          left: 14px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--muted);
          pointer-events: none;
          }
            .search-input {
          width: 100%;
          padding: 11px 46px;
          background: var(--s2);
          border: 1px solid var(--border);
          border-radius: var(--r);
          color: var(--text);
          font-family: 'Outfit', sans-serif;
          font-size: 0.92rem;
          outline: none;
          transition: border-color 0.2s, box-shadow 0.2s;
          }
          .search-input::placeholder { color: var(--muted); }
            .search-input:focus {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px rgba(56,217,255,0.08);
          }
            .kbd {
          position: absolute;
          right: 12px;
          top: 50%;
          transform: translateY(-50%);
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.6rem;
          color: var(--muted);
          background: var(--s3);
          border: 1px solid var(--border);
          border-radius: 4px;
          padding: 2px 6px;
          pointer-events: none;
          }
            .ctrl-btn {
          flex-shrink: 0;
          padding: 10px 13px;
          background: var(--s2);
          border: 1px solid var(--border);
          border-radius: var(--r);
          color: var(--muted);
          cursor: pointer;
          font-size: 0.95rem;
          line-height: 1;
          display: flex;
          align-items: center;
          gap: 6px;
          transition: border-color 0.15s, color 0.15s, background 0.15s;
          white-space: nowrap;
          }
          .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
          .ctrl-btn.on { background: var(--accent-dim); border-color: var(--border-hi); color: var(--accent); }
            .sort-select {
          padding: 10px 12px;
          background: var(--s2);
          border: 1px solid var(--border);
          border-radius: var(--r);
          color: var(--muted);
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.7rem;
          letter-spacing: 0.03em;
          outline: none;
          cursor: pointer;
          transition: border-color 0.2s;
          }
          .sort-select:focus { border-color: var(--accent); }
            
            /* Tag scroll */
            .tag-row {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          scrollbar-width: none;
          padding-bottom: 1px;
          }
          .tag-row::-webkit-scrollbar { display: none; }
            .tag-pill {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.67rem;
          font-weight: 500;
          letter-spacing: 0.04em;
          padding: 5px 12px;
          border-radius: 20px;
          border: 1px solid rgba(56,217,255,0.2);
          background: rgba(56,217,255,0.06);
          color: var(--accent);
          cursor: pointer;
          white-space: nowrap;
          transition: all 0.14s;
          }
          .tag-pill:hover { background: rgba(56,217,255,0.14); }
            .tag-pill.on {
          background: var(--accent);
          color: #07090f;
          border-color: var(--accent);
          font-weight: 700;
          }
            
            /* ── MAIN ──────────────────────────────── */
            .main {
          max-width: 1320px;
          margin: 0 auto;
          padding: 28px 28px 80px;
          }
            
            /* ── SECTION LABEL ─────────────────────── */
            .sec-label {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 14px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.67rem;
          font-weight: 600;
          letter-spacing: 0.12em;
          color: var(--muted);
          text-transform: uppercase;
          }
            .sec-label::after {
          content: '';
          flex: 1;
          height: 1px;
          background: var(--border);
          }
            .sec-badge {
          border-radius: 20px;
          padding: 2px 8px;
          font-size: 0.6rem;
          }
            .sec-badge.pin-badge {
          background: var(--pin-dim);
          border: 1px solid rgba(255,179,71,0.25);
          color: var(--pin);
          }
            
            /* ── PINNED GRID ───────────────────────── */
            #pinned-section { margin-bottom: 36px; }
            .pinned-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
          gap: 10px;
          }
            .pin-card {
          background: var(--s1);
          border: 1px solid rgba(255,179,71,0.18);
          border-radius: 14px;
          padding: 18px 18px 14px;
          cursor: pointer;
          text-decoration: none;
          color: inherit;
          display: flex;
          flex-direction: column;
          gap: 8px;
          position: relative;
          overflow: hidden;
          transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
          animation: popIn 0.3s ease both;
          }
            .pin-card::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, rgba(255,179,71,0.05) 0%, transparent 55%);
          pointer-events: none;
          }
            .pin-card:hover {
          border-color: var(--pin);
          box-shadow: 0 0 0 1px rgba(255,179,71,0.25), 0 8px 36px rgba(255,179,71,0.08);
          transform: translateY(-2px);
          }
            @keyframes popIn {
          from { opacity: 0; transform: scale(0.96) translateY(6px); }
          to   { opacity: 1; transform: scale(1) translateY(0); }
          }
            .pin-card-title {
          font-family: 'Syne', sans-serif;
          font-weight: 700;
          font-size: 1rem;
          color: #fff;
          line-height: 1.25;
          padding-right: 24px;
          }
            .pin-card-desc {
          font-size: 0.78rem;
          color: var(--muted);
          line-height: 1.5;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          }
            .pin-card-footer {
          display: flex;
          flex-wrap: wrap;
          gap: 5px;
          margin-top: auto;
          }
            .unpin-btn {
          position: absolute;
          top: 12px;
          right: 12px;
          background: none;
          border: none;
          font-size: 0.9rem;
          cursor: pointer;
          color: var(--pin);
          opacity: 0.6;
          padding: 4px;
          border-radius: 6px;
          transition: opacity 0.15s, background 0.15s;
          line-height: 1;
          }
          .unpin-btn:hover { opacity: 1; background: var(--pin-dim); }
            
            /* ── RESULT META ───────────────────────── */
            .result-meta {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 10px;
          gap: 10px;
          flex-wrap: wrap;
          }
            .result-count {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.67rem;
          color: var(--muted);
          }
            .active-chip {
          display: flex;
          align-items: center;
          gap: 7px;
          background: var(--accent-dim);
          border: 1px solid var(--border-hi);
          color: var(--accent);
          border-radius: 20px;
          padding: 4px 10px 4px 13px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.65rem;
          }
            .active-chip button {
          background: none;
          border: none;
          color: var(--accent);
          cursor: pointer;
          font-size: 0.8rem;
          line-height: 1;
          padding: 0;
          opacity: 0.7;
          transition: opacity 0.15s;
          }
          .active-chip button:hover { opacity: 1; }
            
            /* ── APP LIST ──────────────────────────── */
          #app-list { display: flex; flex-direction: column; gap: 5px; }
          #app-list.grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
          gap: 8px;
          }
            
            .app-card {
          background: var(--s1);
          border: 1px solid var(--border);
          border-radius: var(--r);
          display: flex;
          overflow: hidden;
          transition: border-color 0.15s, background 0.15s;
          animation: slideIn 0.25s ease both;
          animation-delay: calc(min(var(--i, 0), 25) * 18ms);
          }
            @keyframes slideIn {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
          }
          .app-card:hover { border-color: var(--border-hi); background: var(--s2); }
            
            .app-link {
          flex: 1;
          padding: 13px 15px;
          text-decoration: none;
          color: inherit;
          display: flex;
          align-items: center;
          gap: 14px;
          min-width: 0;
          }
            .app-icon {
          flex-shrink: 0;
          width: 34px;
          height: 34px;
          border-radius: 8px;
          background: var(--s3);
          border: 1px solid var(--border);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.7rem;
          font-weight: 600;
          color: var(--accent);
          letter-spacing: -0.02em;
          }
          .app-body { flex: 1; min-width: 0; }
            .app-title {
          font-weight: 600;
          font-size: 0.9rem;
          color: #fff;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          }
            .app-desc {
          font-size: 0.77rem;
          color: var(--muted);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          margin-top: 1px;
          }
            .app-meta {
          display: flex;
          align-items: center;
          gap: 7px;
          margin-top: 6px;
          flex-wrap: wrap;
          }
            .app-date {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.62rem;
          color: var(--muted);
          }
            .mini-tag {
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.6rem;
          padding: 2px 7px;
          border-radius: 10px;
          border: 1px solid rgba(56,217,255,0.18);
          background: rgba(56,217,255,0.06);
          color: var(--accent);
          cursor: pointer;
          white-space: nowrap;
          transition: all 0.12s;
          }
          .mini-tag:hover { background: rgba(56,217,255,0.14); }
          .mini-tag.on { background: var(--accent); color: #07090f; border-color: var(--accent); }
            
            .pin-toggle {
          display: flex;
          align-items: center;
          padding: 0 15px;
          background: none;
          border: none;
          border-left: 1px solid var(--border);
          color: var(--muted);
          cursor: pointer;
          font-size: 1rem;
          transition: color 0.15s, background 0.15s;
          }
          .pin-toggle:hover { color: var(--pin); background: var(--pin-dim); }
          .pin-toggle.on { color: var(--pin); }
            
            /* Grid card adjustments */
          #app-list.grid .app-card { flex-direction: column; }
          #app-list.grid .app-link {
          flex-direction: row;
          align-items: flex-start;
          padding: 14px 14px 10px;
          }
          #app-list.grid .app-title { white-space: normal; }
          #app-list.grid .app-desc {
          white-space: normal;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          }
          #app-list.grid .pin-toggle {
          border-left: none;
          border-top: 1px solid var(--border);
          padding: 9px 14px;
          justify-content: flex-end;
          font-size: 0.85rem;
          }
            
            /* ── EMPTY STATE ────────────────────────── */
            .empty {
          text-align: center;
          padding: 100px 24px;
          color: var(--muted);
          }
            .empty-glyph {
          font-family: 'Syne', sans-serif;
          font-size: 3rem;
          font-weight: 800;
          color: var(--s3);
          margin-bottom: 12px;
          letter-spacing: -0.04em;
          }
          .empty-text { font-size: 0.9rem; }
            
            /* ── TOAST ──────────────────────────────── */
            .toast {
          position: fixed;
          bottom: 28px;
          left: 50%;
          transform: translateX(-50%) translateY(80px);
          background: var(--s3);
          border: 1px solid var(--border-hi);
          color: var(--accent);
          font-family: 'JetBrains Mono', monospace;
          font-size: 0.73rem;
          letter-spacing: 0.03em;
          padding: 10px 20px;
          border-radius: 30px;
          z-index: 999;
          transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
          box-shadow: 0 8px 32px rgba(0,0,0,0.5);
          pointer-events: none;
          }
          .toast.show { transform: translateX(-50%) translateY(0); }
            
            /* ── RESPONSIVE ─────────────────────────── */
            @media (max-width: 640px) {
               .header { padding: 20px 16px 16px; }
               .controls-inner { padding: 12px 16px; }
               .main { padding: 20px 16px 80px; }
               .pinned-grid { grid-template-columns: 1fr 1fr; }
               .kbd { display: none; }
               .sort-select { display: none; }
          }
            @media (max-width: 380px) {
               .pinned-grid { grid-template-columns: 1fr; }
          }
            </style>
            </head>
            <body>
            
            <div class="header">
            <div class="logo">APP<span class="logo-dot">·</span>HUB</div>
            <span class="app-count-badge" id="total-badge">laden...</span>
            </div>
            
            <div class="controls">
            <div class="controls-inner">
            <div class="search-row">
            <div class="search-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" class="search-input" id="search" placeholder="Zoek op naam, beschrijving of tag…" autocomplete="off" autocorrect="off" spellcheck="false">
            <span class="kbd">/</span>
            </div>
            <button class="ctrl-btn" id="shuffle-btn" title="Willekeurige app openen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
            </svg>
            </button>
            <select class="sort-select" id="sort">
            <option value="date-desc">Nieuwst</option>
            <option value="date-asc">Oudst</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            </select>
            <button class="ctrl-btn" id="view-btn" title="Wissel tussen lijst en grid">
            <svg id="view-icon-list" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            <svg id="view-icon-grid" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:none">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            </button>
            </div>
            <div class="tag-row" id="tag-row"></div>
            </div>
            </div>
            
            <div class="main">
            <div id="pinned-section" style="display:none">
            <div class="sec-label">
            ★ snel starten
            <span class="sec-badge pin-badge" id="pin-count">0</span>
            </div>
            <div class="pinned-grid" id="pinned-grid"></div>
            </div>
          
            <div class="result-meta" id="result-meta" style="display:none">
            <span class="result-count" id="result-count"></span>
            <span id="tag-chip"></span>
            </div>
          
            <div class="sec-label" id="all-label">alle apps</div>
            <div id="app-list"></div>
            </div>
            
            <div class="toast" id="toast"></div>
            
            <script>
            // ── MOCK DATA (for preview — production uses fetch('./branches.json')) ──
            const MOCK = Array.from({length: 32}, (_, i) => {
              const titles = ['Kanban Board','PDF Compressor','Color Picker','Markdown Editor','JSON Formatter','Regex Tester','Pomodoro Timer','Budget Tracker','Recipe Builder','Password Generator','QR Code Maker','CSV Converter','Image Resizer','Font Explorer','API Tester','Dark Mode Toggle','Habit Tracker','Todo List','Calendar Sync','Invoice Generator','URL Shortener','Diagram Editor','Code Formatter','Time Zone Tool','Email Previewer','Diff Checker','Base64 Tool','CRON Builder','SQL Formatter','CSS Playground','SVG Editor','Icon Browser'];
              const descs = ['Eenvoudig slepen en neerzetten voor je taken','Verklein PDF-bestanden zonder kwaliteitsverlies','Kies en converteer kleuren in elke gewenste notatie','Schrijf Markdown met live preview aan de rechterkant','Valideer en versier je JSON data instant','Bouw en test reguliere expressies visueel','Klassieke 25-5 focus timer met statistieken','Houd je maandelijkse uitgaven bij op één plek','Maak recepten met automatische portiescaling','Sterk wachtwoord genereren met aanpasbare regels'];
              const allTags = ['tool','productivity','design','code','finance','media','text','data','time','ui','api','utility'];
              const tags = allTags.filter(() => Math.random() > 0.7).slice(0,3);
              const d = new Date(Date.now() - Math.random() * 30 * 86400000);
              return { slug: `app-${i}`, title: titles[i] || `App ${i+1}`, description: descs[i % descs.length], tags, updatedAt: d.toISOString() };
            });
          
            // ── STATE ──
            let projects = [];
            let pinned   = JSON.parse(localStorage.getItem('hub_pins') || '[]');
            let activeTag = sessionStorage.getItem('hub_tag') || '';
            let gridMode  = localStorage.getItem('hub_grid') === '1';
            let sortMode  = localStorage.getItem('hub_sort') || 'date-desc';
          
            const searchEl  = document.getElementById('search');
            const tagRow    = document.getElementById('tag-row');
            const appList   = document.getElementById('app-list');
            const pinnedSec = document.getElementById('pinned-section');
            const pinnedGrd = document.getElementById('pinned-grid');
            const pinCount  = document.getElementById('pin-count');
            const totalBadge= document.getElementById('total-badge');
            const resultMeta= document.getElementById('result-meta');
            const resultCnt = document.getElementById('result-count');
            const tagChip   = document.getElementById('tag-chip');
            const allLabel  = document.getElementById('all-label');
            const toastEl   = document.getElementById('toast');
            const sortEl    = document.getElementById('sort');
            const viewBtn   = document.getElementById('view-btn');
          
            searchEl.value = sessionStorage.getItem('hub_search') || '';
            sortEl.value   = sortMode;
            if (gridMode) { appList.classList.add('grid'); viewBtn.classList.add('on'); toggleViewIcon(true); }
          
            // ── INIT ──
            async function init() {
            try {
            const r = await fetch('./branches.json?t=' + Date.now());
            projects = (await r.json()).filter(p => p.slug !== 'react-app');
            } catch {
              projects = MOCK;
            }
            totalBadge.textContent = projects.length + ' apps';
            renderTags();
            render();
          }
          
            // ── SORT ──
            function sorted(list) {
            return [...list].sort((a, b) => {
            if (sortMode === 'date-desc') return new Date(b.updatedAt) - new Date(a.updatedAt);
            if (sortMode === 'date-asc')  return new Date(a.updatedAt) - new Date(b.updatedAt);
            if (sortMode === 'az')   return (a.title||'').localeCompare(b.title||'', 'nl');
            if (sortMode === 'za')   return (b.title||'').localeCompare(a.title||'', 'nl');
            return 0;
          });
          }
          
            // ── TAGS ──
            function renderTags() {
            const all = [...new Set(projects.flatMap(p => p.tags||[]))].sort();
            tagRow.innerHTML = all.map(t =>
            `<button class="tag-pill ${t===activeTag?'on':''}" onclick="setTag('${t}')">${t}</button>`
            ).join('');
          }
            function setTag(t) {
          activeTag = activeTag === t ? '' : t;
            sessionStorage.setItem('hub_tag', activeTag);
            renderTags();
            render();
          }
          
            // ── RENDER ──
            function render() {
            const term = searchEl.value.trim().toLowerCase();
            sessionStorage.setItem('hub_search', term);
            
            const filtered = sorted(projects.filter(p => {
            const hay = `${p.title} ${p.description} ${(p.tags||[]).join(' ')}`.toLowerCase();
            return hay.includes(term) && (!activeTag || (p.tags||[]).includes(activeTag));
          }));
            
            const pinnedList   = filtered.filter(p => pinned.includes(p.slug));
            const unpinnedList = filtered.filter(p => !pinned.includes(p.slug));
            
            // Pinned quick-launch
            pinCount.textContent = pinned.length;
          pinnedSec.style.display = pinnedList.length ? '' : 'none';
            pinnedGrd.innerHTML = pinnedList.map(p => pinnedCardHTML(p)).join('');
            
            // Meta bar
            const hasFilter = term || activeTag;
          resultMeta.style.display = hasFilter ? '' : 'none';
            resultCnt.textContent = `${filtered.length} van ${projects.length} apps`;
            tagChip.innerHTML = activeTag
            ? `<span class="active-chip">${activeTag} <button onclick="setTag('${activeTag}')">✕</button></span>`
            : '';
            
            // App list
            if (filtered.length === 0) {
            appList.innerHTML = `<div class="empty"><div class="empty-glyph">◎</div><div class="empty-text">Geen resultaten gevonden</div></div>`;
          } else {
            appList.innerHTML = unpinnedList.map((p, i) => appCardHTML(p, i)).join('');
          }
          }
          
            // ── CARD HTML ──
            function initials(title) {
            return (title||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
          }
          
            function pinnedCardHTML(p) {
            const slug = p.slug || p.name;
            const tags = (p.tags||[]).slice(0,3);
            return `
            <a class="pin-card" href="./${slug}/" onclick="event.stopPropagation()">
            <button class="unpin-btn" onclick="event.preventDefault();event.stopPropagation();togglePin('${slug}')" title="Unpin">★</button>
            <div class="pin-card-title">${p.title||'Untitled'}</div>
            <div class="pin-card-desc">${p.description||''}</div>
            <div class="pin-card-footer">
            ${tags.map(t=>`<span class="mini-tag">${t}</span>`).join('')}
            </div>
            </a>`;
          }
          
            function appCardHTML(p, i) {
            const slug = p.slug || p.name;
            const isPinned = pinned.includes(slug);
            const tags = (p.tags||[]).slice(0,4);
            const date = p.updatedAt
          ? new Date(p.updatedAt).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
            : '';
            return `
            <div class="app-card" style="--i:${i}">
            <a class="app-link" href="./${slug}/">
            <div class="app-icon">${initials(p.title)}</div>
            <div class="app-body">
            <div class="app-title">${p.title||'Untitled'}</div>
            <div class="app-desc">${p.description||''}</div>
            <div class="app-meta">
            <span class="app-date">${date}</span>
            ${tags.map(t=>`<span class="mini-tag ${t===activeTag?'on':''}" onclick="event.preventDefault();event.stopPropagation();setTag('${t}')">${t}</span>`).join('')}
            </div>
            </div>
            </a>
            <button class="pin-toggle ${isPinned?'on':''}" onclick="togglePin('${slug}')" title="${isPinned?'Unpin':'Pin voor snel starten'}">
          ${isPinned ? '★' : '☆'}
            </button>
            </div>`;
          }
          
            // ── PIN ──
            function togglePin(slug) {
            if (pinned.includes(slug)) {
            pinned = pinned.filter(s => s !== slug);
            toast('Losgekoppeld');
          } else {
            pinned.push(slug);
            toast('Gepind ★');
          }
            localStorage.setItem('hub_pins', JSON.stringify(pinned));
            render();
          }
          
            // ── TOAST ──
            let toastTimer;
            function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
          }
          
            // ── CONTROLS ──
            searchEl.addEventListener('input', render);
          
            sortEl.addEventListener('change', () => {
            sortMode = sortEl.value;
            localStorage.setItem('hub_sort', sortMode);
            render();
          });
          
            function toggleViewIcon(isGrid) {
          document.getElementById('view-icon-list').style.display = isGrid ? 'none' : '';
          document.getElementById('view-icon-grid').style.display = isGrid ? '' : 'none';
          }
            viewBtn.addEventListener('click', () => {
            gridMode = !gridMode;
          localStorage.setItem('hub_grid', gridMode ? '1' : '');
            appList.classList.toggle('grid', gridMode);
            viewBtn.classList.toggle('on', gridMode);
            toggleViewIcon(gridMode);
          });
          
            document.getElementById('shuffle-btn').addEventListener('click', () => {
            if (!projects.length) return;
            const p = projects[Math.floor(Math.random() * projects.length)];
            location.href = './' + (p.slug || p.name) + '/';
          });
          
            // ── KEYBOARD ──
            document.addEventListener('keydown', e => {
            if (e.key === '/' && document.activeElement !== searchEl) {
            e.preventDefault();
            searchEl.focus();
            searchEl.select();
          }
            if (e.key === 'Escape' && document.activeElement === searchEl) {
            if (searchEl.value) { searchEl.value = ''; render(); }
            else searchEl.blur();
          }
          });
          
            init();
            </script>
            </body>
            </html>

  EOF

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root_deploy
          target-folder: .
          branch: gh-pages
          clean: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
