name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch
  
# Zorgt ervoor dat slechts één build tegelijk naar gh-pages kan schrijven.
# Andere builds die op hetzelfde moment starten, worden in de wachtrij gezet.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false # We willen ze NIET annuleren, maar achter elkaar uitvoeren
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

        # --- AUTO-INSTALLER ---
      - name: Auto-sync missing dependencies
        id: sync
        run: |
          npx depcheck --json > depcheck-report.json || true
          
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const report = JSON.parse(fs.readFileSync('./depcheck-report.json', 'utf8'));
            const pkgJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const missing = Object.keys(report.missing || {});
            
            if (missing.length > 0) {
              missing.forEach(pkg => {
                try {
                  const version = execSync('pnpm info ' + pkg + ' version').toString().trim();
                  pkgJson.dependencies[pkg] = '^' + version;
                  console.log('Toegevoegd: ' + pkg + '@^' + version);
                } catch (e) {
                  pkgJson.dependencies[pkg] = 'latest';
                }
              });
              fs.writeFileSync('./package.json', JSON.stringify(pkgJson, null, 2));
              console.log('SYNC_COMPLETE=true');
            }
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit changes to branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync dependencies [skip ci]"
          file_pattern: 'package.json'
          skip_dirty_check: false

      - name: Build and Update Branch Registry
        run: |
          CLEAN_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//_/g')
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$CLEAN_NAME/
          pnpm run build --base=$VITE_BASE_PATH
          
          # Prepare deployment folder
          mkdir -p root_deploy/$CLEAN_NAME
          cp -r dist/* root_deploy/$CLEAN_NAME/

          # Try to get the existing branch list from the live site
          # We download the existing branches.json if it exists
          curl -fsSL https://harm-nullix.github.io/${{ github.event.repository.name }}/branches.json > branches.json || echo "[]" > branches.json
          
          # Use Node to safely update the JSON array without duplicates
          node -e "
            const fs = require('fs');
            let branches = JSON.parse(fs.readFileSync('branches.json', 'utf8'));
            if (!Array.isArray(branches)) branches = [];
            if (!branches.includes('$CLEAN_NAME')) branches.push('$CLEAN_NAME');
            fs.writeFileSync('root_deploy/branches.json', JSON.stringify(branches));
          "

          # Generate the Portal index.html that reads this JSON
          cat <<EOF > root_deploy/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Project Portal</title>
            <style>
              body { font-family: system-ui, sans-serif; padding: 40px; background: #f9fafb; color: #111827; }
              .container { max-width: 600px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
              .branch-link { display: block; padding: 12px; margin: 8px 0; background: #f3f4f6; color: #2563eb; text-decoration: none; border-radius: 6px; }
              .branch-link:hover { background: #e5e7eb; }
              .tag { font-size: 0.8rem; background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 99px; margin-left: 8px; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Deployments</h1>
              <div id="list">Loading branches...</div>
            </div>
            <script>
              fetch('./branches.json')
                .then(r => r.json())
                .then(branches => {
                  const list = document.getElementById('list');
                  list.innerHTML = branches.map(b => 
                    \`<a class="branch-link" href="./\${b}/">📂 \${b} \${b === '$CLEAN_NAME' ? '<span class="tag">Just Updated</span>' : ''}</a>\`
                  ).join('');
                });
            </script>
          </body>
          </html>
          EOF
          
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root_deploy
          target-folder: .
          branch: gh-pages
          clean: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
