name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch

# Zorgt ervoor dat slechts één build tegelijk naar gh-pages kan schrijven.
concurrency:
  group: deploy-to-gh-pages  # Vaste string voor de hele repo
  cancel-in-progress: false   # Belangrijk: zet ze in de wachtrij, niet annuleren!

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # --- AUTO-INSTALLER ---
      - name: Auto-sync missing dependencies
        id: sync
        run: |
          npx depcheck --json > depcheck-report.json || true
          
          node << 'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');
          
          try {
            const report = JSON.parse(fs.readFileSync('./depcheck-report.json', 'utf8'));
            const pkgJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const missing = Object.keys(report.missing || {});
          
            if (missing.length > 0) {
              if (!pkgJson.dependencies) pkgJson.dependencies = {};
              missing.forEach(pkg => {
                try {
                  const version = execSync('pnpm info ' + pkg + ' version').toString().trim();
                  pkgJson.dependencies[pkg] = '^' + version;
                  console.log('Toegevoegd: ' + pkg + '@^' + version);
                } catch (e) {
                  pkgJson.dependencies[pkg] = 'latest';
                }
              });
              fs.writeFileSync('./package.json', JSON.stringify(pkgJson, null, 2));
              console.log('SYNC_COMPLETE=true');
            }
          } catch (err) {
            console.error('Fout tijdens sync:', err);
          }
          EOF

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # STAP 1: Genereer de slug in een eigen schone omgeving
      - name: Generate Project Slug
        id: slug_generator
        run: |
          node << 'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const title = pkg.title || pkg.name || 'untitled';
          const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
          
          // Sla de slug veilig op in de GitHub omgeving
          fs.appendFileSync(process.env.GITHUB_ENV, `PROJECT_SLUG=${slug}\n`);
          EOF

      # STAP 2: Bouw de applicatie en update de registry
      - name: Build and Update Branch Registry
        run: |
          # Gebruik de SLUG voor het Vite pad
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$PROJECT_SLUG/
          pnpm run build --base=$VITE_BASE_PATH
          
          # Bereid de mappen voor
          mkdir -p root_deploy/$PROJECT_SLUG
          cp -r dist/* root_deploy/$PROJECT_SLUG/
          
          # Registry updaten (met cache buster)
          curl -fsSL "https://harm-nullix.github.io/react-slop/branches.json?$(date +%s)" > branches.json || echo "[]" > branches.json
          
          # Update branches.json via Node
          node << 'EOF'
          const fs = require('fs');
          
          let registry;
          try {
              const content = fs.readFileSync('branches.json', 'utf8').trim();
              registry = content.startsWith('<') ? [] : JSON.parse(content);
          } catch (e) { 
              registry = []; 
          }
          
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          const slug = process.env.PROJECT_SLUG;
          const branchName = process.env.GITHUB_REF_NAME;
          
          registry = registry.map(item => {
              return {
                  name: item.name,
                  slug: item.slug || item.name,
                  title: item.title || item.name,
                  description: item.description || '',
                  tags: item.tags || [],
                  updatedAt: item.updatedAt
              };
          });
          
          registry = registry.filter(item => item.slug !== slug);
          
          registry.push({
              name: branchName,
              slug: slug,
              title: pkg.title || pkg.name || slug,
              description: pkg.description || '',
              tags: pkg.tags || [],
              updatedAt: new Date().toISOString()
          });
          
          fs.writeFileSync('root_deploy/branches.json', JSON.stringify(registry, null, 2));
          EOF

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root_deploy
          target-folder: .
          branch: gh-pages
          clean: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
