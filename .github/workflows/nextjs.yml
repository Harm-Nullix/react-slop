name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch
  
# Zorgt ervoor dat slechts één build tegelijk naar gh-pages kan schrijven.
# Andere builds die op hetzelfde moment starten, worden in de wachtrij gezet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

        # --- AUTO-INSTALLER ---
      - name: Auto-sync missing dependencies
        id: sync
        run: |
          npx depcheck --json > depcheck-report.json || true
          
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const report = JSON.parse(fs.readFileSync('./depcheck-report.json', 'utf8'));
            const pkgJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const missing = Object.keys(report.missing || {});
            
            if (missing.length > 0) {
              missing.forEach(pkg => {
                try {
                  const version = execSync('pnpm info ' + pkg + ' version').toString().trim();
                  pkgJson.dependencies[pkg] = '^' + version;
                  console.log('Toegevoegd: ' + pkg + '@^' + version);
                } catch (e) {
                  pkgJson.dependencies[pkg] = 'latest';
                }
              });
              fs.writeFileSync('./package.json', JSON.stringify(pkgJson, null, 2));
              console.log('SYNC_COMPLETE=true');
            }
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build and Update Branch Registry
        run: |
          # Haal de titel op uit package.json en maak er een URL-veilige slug van
          # We gebruiken node om dit betrouwbaar te doen
          PROJECT_SLUG=$(node -e "
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const title = pkg.title || pkg.name || 'untitled';
            console.log(title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''));
          ")
          
          # We houden CLEAN_NAME nog wel even voor de map-structuur (uniekheid)
          CLEAN_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//_/g')
          
          # Gebruik de SLUG voor het Vite pad
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$PROJECT_SLUG/
          pnpm run build --base=$VITE_BASE_PATH
          
          # Prepare folders
          # Let op: We deployen nu naar de map die matcht met je VITE_BASE_PATH
          mkdir -p root_deploy/$PROJECT_SLUG
          cp -r dist/* root_deploy/$PROJECT_SLUG/
          
          # Registry updaten
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branches.json?$(date +%s)" > branches.json || echo "[]" > branches.json
          
          node -e "
            const fs = require('fs');
            let registry;
            try {
              const content = fs.readFileSync('branches.json', 'utf8').trim();
              registry = content.startsWith('<') ? [] : JSON.parse(content);
            } catch (e) { registry = []; }

            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const slug = '$PROJECT_SLUG';
            
            // Verwijder oude entry op basis van de slug OF de branch naam
            registry = registry.filter(item => item.slug !== slug && item.branch !== '$CLEAN_NAME');
            
            registry.push({
              name: '$CLEAN_NAME',      // De fysieke branch (voor debug)
              slug: slug,               // De URL naam
              title: pkg.title || pkg.name || '$CLEAN_NAME',
              description: pkg.description || '',
              tags: pkg.tags || [],
              updatedAt: new Date().toISOString()
            });
            
            fs.writeFileSync('root_deploy/branches.json', JSON.stringify(registry));
          "
          
          # Genereer Portal HTML
          cat <<EOF > root_deploy/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>React Slop Dashboard</title>
            <style>
              :root { --primary: #2563eb; --bg: #f3f4f6; --card: #ffffff; }
              body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: var(--bg); color: #1f2937; line-height: 1.5; }
              .container { max-width: 900px; margin: 0 auto; }
              
              /* Search & Filter bar */
              .controls { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 24px; display: flex; gap: 10px; flex-wrap: wrap; position: sticky; top: 10px; z-index: 100; }
              input[type="text"] { flex: 1; padding: 10px 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
              
              /* Project Cards */
              .project-list { display: flex; flex-direction: column; gap: 12px; }
              .section-title { font-size: 0.875rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 10px 5px; }
              
              .card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: flex-start; transition: transform 0.1s, border-color 0.2s; position: relative; text-decoration: none; color: inherit; }
              .card:hover { border-color: var(--primary); transform: translateY(-1px); }
              .card-content { flex: 1; cursor: pointer; }
              
              .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
              .title { font-weight: 700; font-size: 1.125rem; color: #111827; }
              .description { color: #4b5563; font-size: 0.95rem; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
              
              /* Tags & Badges */
              .tag-list { display: flex; gap: 6px; flex-wrap: wrap; }
              .tag { background: #eff6ff; color: #1e40af; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; border: 1px solid #dbeafe; cursor: pointer; }
              .tag:hover { background: #dbeafe; }
              .tag.active { background: var(--primary); color: white; }
              
              /* Pin button */
              .pin-btn { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: 5px; color: #d1d5db; transition: color 0.2s; }
              .pin-btn.active { color: #f59e0b; }
              .pin-btn:hover { color: #f59e0b; }
          
              .meta { font-size: 0.75rem; color: #9ca3af; margin-top: 10px; display: block; }
              .hidden { display: none; }
            </style>
          </head>
          <body>
          
          <div class="container">
            <div class="controls">
              <input type="text" id="search" placeholder="Search by title, desc or tags..." autocomplete="off">
              <div id="autocomplete-tags" class="tag-list" style="width: 100%; margin-top: 5px;"></div>
            </div>
          
            <div id="pinned-section" class="hidden">
              <h2 class="section-title">📌 Pinned Projects</h2>
              <div id="pinned-list" class="project-list"></div>
            </div>
          
            <h2 class="section-title">All Projects</h2>
            <div id="main-list" class="project-list"></div>
          </div>
          
          <script>
            let projects = [];
            let pinnedIds = JSON.parse(localStorage.getItem('pinnedProjects') || '[]');
            let activeTag = sessionStorage.getItem('activeTag') || '';
          
            const searchInput = document.getElementById('search');
            searchInput.value = sessionStorage.getItem('searchTerm') || '';
          
            async function init() {
              const res = await fetch('./branches.json?t=' + Date.now());
              projects = await res.json();
              
              // Sorteren op laatst aangepast
              projects.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
              
              render();
              renderTags();
            }
          
            function togglePin(slug, e) {
              e.preventDefault();
              if (pinnedIds.includes(slug)) {
                pinnedIds = pinnedIds.filter(id => id !== slug);
              } else {
                pinnedIds.push(slug);
              }
              localStorage.setItem('pinnedProjects', JSON.stringify(pinnedIds));
              render();
            }
          
            function renderTags() {
              const allTags = [...new Set(projects.flatMap(p => p.tags || []))].sort();
              const container = document.getElementById('autocomplete-tags');
              container.innerHTML = allTags.map(tag => `
                <span class="tag ${tag === activeTag ? 'active' : ''}" onclick="filterTag('${tag}')">${tag}</span>
              `).join('');
            }
          
            function filterTag(tag) {
              activeTag = activeTag === tag ? '' : tag;
              sessionStorage.setItem('activeTag', activeTag);
              render();
              renderTags();
            }
          
            function render() {
              const term = searchInput.value.toLowerCase();
              sessionStorage.setItem('searchTerm', term);
          
              const filtered = projects.filter(p => {
                const matchText = (p.title + p.description + (p.tags||[]).join(' ')).toLowerCase().includes(term);
                const matchTag = activeTag === '' || (p.tags || []).includes(activeTag);
                return matchText && matchTag;
              });
          
              const pinned = filtered.filter(p => pinnedIds.includes(p.slug));
              const unpinned = filtered.filter(p => !pinnedIds.includes(p.slug));
          
              document.getElementById('pinned-section').className = pinned.length ? '' : 'hidden';
              
              document.getElementById('pinned-list').innerHTML = pinned.map(p => createCard(p, true)).join('');
              document.getElementById('main-list').innerHTML = unpinned.map(p => createCard(p, false)).join('');
            }
          
            function createCard(p, isPinned) {
              const date = new Date(p.updatedAt).toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
              return `
                <div class="card">
                  <a href="./${p.slug}/" class="card-content">
                    <div class="title-row">
                      <span class="title">${p.title}</span>
                    </div>
                    <p class="description">${p.description}</p>
                    <div class="tag-list">
                      ${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <span class="meta">Updated: ${date}</span>
                  </a>
                  <button class="pin-btn ${isPinned ? 'active' : ''}" onclick="togglePin('${p.slug}', event)">
                    ${isPinned ? '★' : '☆'}
                  </button>
                </div>
              `;
            }
          
            searchInput.addEventListener('input', render);
            init();
          </script>
          </body>
          </html>
          EOF
          
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root_deploy
          target-folder: .
          branch: gh-pages
          clean: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
