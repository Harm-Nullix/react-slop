name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # Updated to v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          CLEAN_NAME=$(echo ${GITHUB_REF_NAME} | sed 's/\//_/g')
          # We set an environment variable that Vite will read
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$CLEAN_NAME/
          pnpm run build --base=$VITE_BASE_PATH

      - name: Deploy to Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          target-folder: ${{ github.ref_name }}
          branch: gh-pages
          clean: false # Keeps other branch folders alive
