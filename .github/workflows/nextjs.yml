name: Deploy Branch to Persistent Subfolder

on:
  push:
    branches:
      - '**'

permissions:
  contents: write # Crucial for pushing to the gh-pages branch
  
# Zorgt ervoor dat slechts één build tegelijk naar gh-pages kan schrijven.
# Andere builds die op hetzelfde moment starten, worden in de wachtrij gezet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

        # --- AUTO-INSTALLER ---
      - name: Auto-sync missing dependencies
        id: sync
        run: |
          npx depcheck --json > depcheck-report.json || true
          
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            const report = JSON.parse(fs.readFileSync('./depcheck-report.json', 'utf8'));
            const pkgJson = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const missing = Object.keys(report.missing || {});
            
            if (missing.length > 0) {
              missing.forEach(pkg => {
                try {
                  const version = execSync('pnpm info ' + pkg + ' version').toString().trim();
                  pkgJson.dependencies[pkg] = '^' + version;
                  console.log('Toegevoegd: ' + pkg + '@^' + version);
                } catch (e) {
                  pkgJson.dependencies[pkg] = 'latest';
                }
              });
              fs.writeFileSync('./package.json', JSON.stringify(pkgJson, null, 2));
              console.log('SYNC_COMPLETE=true');
            }
          "

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build and Update Branch Registry
        run: |
          # Gebruik de SLUG voor het Vite pad
          export VITE_BASE_PATH=/${{ github.event.repository.name }}/$PROJECT_SLUG/
          pnpm run build --base=$VITE_BASE_PATH
          
          mkdir -p root_deploy/$CLEAN_NAME
          cp -r dist/* root_deploy/$CLEAN_NAME/
          
          # Download bestaande registry
          curl -fsSL https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branches.json > branches.json || echo "[]" > branches.json
          
          # Update JSON via Node
          node -e "
            const fs = require('fs');
            let registry;
            try {
              const content = fs.readFileSync('branches.json', 'utf8').trim();
              registry = content.startsWith('<') ? [] : JSON.parse(content);
            } catch (e) { registry = []; }
            registry = registry.filter(item => item.name !== '$CLEAN_NAME');
            registry.push({
              name: '$CLEAN_NAME',
              updatedAt: new Date().toISOString()
            });
            fs.writeFileSync('root_deploy/branches.json', JSON.stringify(registry));
          "
          
          # Genereer Portal HTML
          cat <<EOF > root_deploy/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Project Portal</title>
            <style>
              body { font-family: system-ui, sans-serif; padding: 40px; background: #f3f4f6; color: #1f2937; }
              .card { max-width: 800px; margin: 0 auto; background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
              h1 { margin-bottom: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
              h2 { font-size: 1.1rem; margin-top: 20px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.05em; }
              .link { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; margin: 4px 0; background: #fff; color: #2563eb; text-decoration: none; border-radius: 8px; border: 1px solid #e5e7eb; transition: all 0.15s; }
              .link:hover { border-color: #3b82f6; background: #eff6ff; }
              details { margin: 8px 0; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
              summary { padding: 12px 16px; background: #f9fafb; cursor: pointer; font-weight: 600; color: #374151; }
              summary:hover { background: #f3f4f6; }
              details .link { border: none; border-top: 1px solid #f3f4f6; margin: 0; border-radius: 0; padding-left: 32px; }
              .latest-tag { background: #dcfce7; color: #166534; font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; margin-left: 10px; }
              .time { font-size: 0.8rem; color: #9ca3af; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>App Explorer</h1>
              <div id="flat-list"></div>
              <div id="nested-list"></div>
            </div>
            <script>
              fetch('./branches.json').then(r => r.json()).then(data => {
                const sortedData = data.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                const flatList = document.getElementById('flat-list');
                const nestedList = document.getElementById('nested-list');
                const groups = {};
                const flats = [];

                sortedData.forEach(item => {
                  if (item.name.includes('_')) {
                    const parts = item.name.split('_');
                    const root = parts; // Pak het eerste deel als groepsnaam
                    if (!groups[root]) groups[root] = [];
                    groups[root].push(item);
                  } else {
                    flats.push(item);
                  }
                });

                if (flats.length > 0) {
                  flatList.innerHTML = '<h2>Branches</h2>' + flats.map(item => renderLink(item)).join('');
                }

                Object.keys(groups).sort().forEach(root => {
                  const folderHtml = '<details><summary>📁 ' + root + ' (' + groups[root].length + ')</summary>' + 
                    groups[root].map(item => renderLink(item)).join('') + '</details>';
                  nestedList.innerHTML += folderHtml;
                });
              });

              function renderLink(item) {
                const isLatest = item.name === "$CLEAN_NAME";
                const date = new Date(item.updatedAt).toLocaleDateString();
                return '<a class="link" href="./' + item.name + '/"><span>' + item.name + (isLatest ? ' <span class="latest-tag">LATEST</span>' : '') + '</span><span class="time">' + date + '</span></a>';
              }
            </script>
          </body>
          </html>
          EOF
          
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: root_deploy
          target-folder: .
          branch: gh-pages
          clean: false
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
